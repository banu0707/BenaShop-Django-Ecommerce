{% extends "store/base.html" %}

{% block title %}
Products | BenaShop
{% endblock %}


{% block content %}

<div class="container mt-5">

    <h1>
        All Products
    </h1>


    <form
        method="GET"
        class="row mb-5 mt-4">

        <div class="col-md-6">

            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="Search products...">

        </div>


        <div class="col-md-3">

            <select
                name="category"
                class="form-select">

                <option value="">
                    All Categories
                </option>

                {% for category in categories %}

                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="col-md-3">

            <button
                class="btn btn-danger w-100">
                Search
            </button>

        </div>

    </form>


    <div class="row">

        {% for product in products %}

        <div class="col-md-3 mb-4">

            <div class="card product-card">

                <img
                    src="{{ product.image.url }}"
                    class="card-img-top product-image">

                <div class="card-body">

                    <h5>
                        {{ product.name }}
                    </h5>

                    <p>
                        ⭐ {{ product.rating }}
                    </p>

                    <h5>
                        ₹{{ product.price }}
                    </h5>

                    <a
                        href="{% url 'product_detail' product.id %}"
                        class="btn btn-danger w-100">
                        View Details
                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <h4>
            No products found.
        </h4>

        {% endfor %}

    </div>

</div>

{% endblock %}
