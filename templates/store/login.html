{% extends "store/base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="card p-4">

        <h2 class="text-center">
            Login
        </h2>


        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control mb-3"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control mb-3"
                required>


            <button
                class="btn btn-danger w-100">
                Login
            </button>

        </form>


        <p class="text-center mt-3">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
